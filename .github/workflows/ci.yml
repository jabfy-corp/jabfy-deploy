name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-configuration:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose YAML
        run: ruby -e 'require "yaml"; YAML.load_file("docker-compose.yml")'

      - name: Validate image lock entries
        shell: bash
        run: |
          set -euo pipefail
          required_images=(
            JABFY_CORE_IMAGE
            JABFY_BUS_IMAGE
            JABFY_VOICE_IMAGE
            JABFY_WEBSITE_FRONTEND_IMAGE
            JABFY_WEBSITE_BACKEND_IMAGE
          )

          for key in "${required_images[@]}"; do
            value=$(grep -E "^${key}=" deployment.env | cut -d= -f2-)
            [[ -n "$value" ]] || { echo "Missing $key"; exit 1; }
            [[ "$value" =~ ^ghcr\.io/jabfy-corp/[a-z0-9-]+@sha256:([a-f0-9]{64}|REPLACE_WITH_[A-Z_]+_DIGEST)$ ]] || {
              echo "Invalid image lock for $key"
              exit 1
            }
          done
